services:
  # Backend FastAPI Web Service (Free Tier)
  - type: web
    name: finsight-backend-kxfy
    plan: free
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Configure this secret in Render with the Supabase session-pooler URL; never commit credentials.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: TWELVEDATA_API_KEY
        value: 839a60cc045e43a18dbba1a175907858
      - key: TWELVEDATA_BASE_URL
        value: https://api.twelvedata.com
      - key: MARKET_WATCHLIST
        value: SPY,QQQ,TLT,GLD,BTC/USD
      - key: MARKET_MAX_SYMBOLS
        value: "6"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: FinSight AI <onboarding@resend.dev>
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-chat:free
      - key: LLM_PROVIDER_PRIORITY
        value: '["groq","openrouter"]'

  # Frontend Static Site
  - type: web
    name: finsight-frontend-2w1v
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://finsight-backend-kxfy.onrender.com/api/v1
